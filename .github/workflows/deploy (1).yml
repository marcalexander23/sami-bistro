name: Deploy
# Runs after a pull request is merged into main.
# Build once, prove it on staging, wait for a human, then promote the same image.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; a newer merge waits for the current one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write   # lets the job ask Azure for a short-lived login (no stored password)
  contents: read

env:
  REGISTRY: acrsamibistro7k2
  RESOURCE_GROUP: rg-sami-bistro
  IMAGE: hello-api

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Get the merged code
        uses: actions/checkout@v4

      - name: Work out the image tag (first 7 characters of the commit)
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure (passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build the image once, in Azure
        run: az acr build --registry "$REGISTRY" --image "$IMAGE:${{ steps.tag.outputs.tag }}" .

      - name: Point staging at the new image
        run: |
          az containerapp update \
            --name ca-hello-api-staging \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY.azurecr.io/$IMAGE:${{ steps.tag.outputs.tag }}" \
            --set-env-vars APP_VERSION=${{ steps.tag.outputs.tag }}

      - name: Smoke test staging
        run: |
          fqdn=$(az containerapp show --name ca-hello-api-staging \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          # The new revision can take a moment to take traffic, so retry a few
          # times. Each attempt also checks /health reports the tag just deployed.
          for attempt in 1 2 3 4 5; do
            if bash scripts/smoke-test.sh "https://$fqdn" "${{ steps.tag.outputs.tag }}"; then exit 0; fi
            echo "Attempt $attempt failed; waiting 15s before retrying"
            sleep 15
          done
          exit 1

  production:
    needs: staging
    runs-on: ubuntu-latest
    # The 'production' environment holds the approval gate (required reviewer).
    environment: production
    steps:
      - name: Get the merged code
        uses: actions/checkout@v4

      - name: Sign in to Azure (passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Promote the same image to production (no rebuild)
        run: |
          az containerapp update \
            --name ca-hello-api \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY.azurecr.io/$IMAGE:${{ needs.staging.outputs.tag }}" \
            --set-env-vars APP_ENV=production APP_VERSION=${{ needs.staging.outputs.tag }}

      - name: Smoke test production
        run: |
          fqdn=$(az containerapp show --name ca-hello-api \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          # The new revision can take a moment to take traffic, so retry a few
          # times. Each attempt also checks /health reports the tag just deployed.
          for attempt in 1 2 3 4 5; do
            if bash scripts/smoke-test.sh "https://$fqdn" "${{ needs.staging.outputs.tag }}"; then exit 0; fi
            echo "Attempt $attempt failed; waiting 15s before retrying"
            sleep 15
          done
          exit 1
